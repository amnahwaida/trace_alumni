{{define "user_form.html"}}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.PageTitle}} - {{if .Settings.pwa_app_name}}{{.Settings.pwa_app_name}}{{else}}Alumni Tracker{{end}}</title>
    <link rel="icon" type="image/x-icon" href="{{if .Settings.favicon_path}}{{.Settings.favicon_path}}{{else}}/static/favicon.ico{{end}}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-slate-950 text-white min-h-screen">
    {{template "sidebar" .}}
    {{template "mobile_header" .}}

    <main class="lg:ml-64 p-4 md:p-8">
        <div class="mb-6">
            <a href="/dashboard/users" class="text-xs md:text-sm text-slate-400 hover:text-blue-400 transition-colors">← Kembali</a>
            <h1 class="text-xl md:text-2xl font-bold mt-2">Tambah User</h1>
        </div>
        {{if .Error}}<div class="bg-red-500/10 border border-red-500/30 rounded-lg p-3 mb-4 text-red-300 text-sm">❌ {{.Error}}</div>{{end}}
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-lg">
            <form method="POST" action="/dashboard/users/store" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Username <span class="text-red-400">*</span></label>
                    <input type="text" name="username" required class="w-full px-3 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Password <span class="text-red-400">*</span></label>
                    <input type="password" name="password" required minlength="6" class="w-full px-3 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 text-sm">
                    <p class="text-xs text-slate-500 mt-1">Minimal 6 karakter</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Role <span class="text-red-400">*</span></label>
                    <select name="role" required class="w-full px-3 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 text-sm">
                        <option value="">-- Pilih Role --</option>
                        <option value="admin">Admin</option>
                        <option value="staff">Staff</option>
                        <option value="super_admin">Super Admin</option>
                    </select>
                </div>
                <div class="flex gap-3 pt-4 border-t border-slate-800">
                    <button type="submit" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-medium transition-colors">Simpan</button>
                    <a href="/dashboard/users" class="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-medium text-slate-300 transition-colors">Batal</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
{{end}}
